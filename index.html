<!doctype html>
<html lang="es-CO" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b0a" />
    <meta
      name="description"
      content="Unimarket: el marketplace de los estudiantes de la Universidad de Córdoba. Catálogos, subastas, rifas y UNICOIN."
    />
    <title>Unimarket · Tu mercado universitario</title>
    <script>
      try {
        var t = localStorage.getItem('unimarket:theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
